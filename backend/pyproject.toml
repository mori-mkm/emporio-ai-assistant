[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-assistant"
version = "0.1.0"
description = "Backend for the Empório da Música AI support assistant."
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic==2.3.0",  # official Claude SDK (Messages API); used only by the live adapter
    "openai==3.42.1",  # official OpenAI SDK (Responses API); used only by the Luna adapter
    "fastapi==0.162.0",
    "pypdf==6.21.4",  # local text extraction of the store manual (pure Python, BSD-3)
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",  # required by FastAPI's TestClient
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
emporio-prepare-data = "emporio_assistant.prepare_data:main"

[tool.setuptools]
packages = ["emporio_assistant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as default arguments.
extend-immutable-calls = [
    "emporio_assistant.agent.AgentConfig",
    "emporio_assistant.anthropic_adapter.GenerationSettings",
    "emporio_assistant.openai_adapter.OpenAISettings",
    "emporio_assistant.ollama_adapter.OllamaSettings",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
