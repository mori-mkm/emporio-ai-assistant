[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-assistant"
version = "0.1.0"
description = "Backend for the Empório da Música AI support assistant."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",  # required by FastAPI's TestClient
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.setuptools]
packages = ["emporio_assistant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
